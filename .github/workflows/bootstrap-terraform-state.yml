name: Bootstrap Terraform State

on:
  workflow_dispatch:
    inputs:
      noncurrent_state_version_expiration_days:
        description: Days to retain old noncurrent state versions.
        required: true
        default: "30"
        type: string
      apply:
        description: Apply the bootstrap plan. Leave false for plan-only.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: automation-bootstrap
    defaults:
      run:
        working-directory: bootstrap/terraform-state
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate protected configuration
        env:
          AWS_BOOTSTRAP_ROLE_ARN: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          set -euo pipefail

          required=(
            AWS_BOOTSTRAP_ROLE_ARN
            AWS_REGION
            TF_STATE_BUCKET
            TF_STATE_LOCK_TABLE
          )
          missing=()
          for name in "${required[@]}"; do
            value="${!name-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required protected configuration:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform plan
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform plan -no-color -out=tfplan \
            -var "aws_region=$AWS_REGION" \
            -var "state_bucket_name=$TF_STATE_BUCKET" \
            -var "lock_table_name=$TF_STATE_LOCK_TABLE" \
            -var "noncurrent_state_version_expiration_days=${{ inputs.noncurrent_state_version_expiration_days }}"

      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform apply -no-color -auto-approve tfplan

      - name: Clear AWS credentials
        if: always()
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_SECURITY_TOKEN="
            echo "AWS_REGION="
            echo "AWS_DEFAULT_REGION="
          } >> "$GITHUB_ENV"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Terraform state bootstrap"
            echo ""
            echo "- Backend configuration: protected"
            echo "- Apply requested: \`${{ inputs.apply }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
