name: Release Rancher Runway for macOS
run-name: Release Rancher Runway ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to package.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RANCHER_RUNWAY_RELEASE_REPOSITORY: ${{ github.repository }}
  RANCHER_RUNWAY_OUTPUT_DIR: dist
  RANCHER_RUNWAY_SIGNING_MODE: developer-id

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      app_artifact: ${{ steps.app.outputs.artifact-id }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1, got '$RELEASE_TAG'" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Selected tag $GITHUB_REF_NAME does not match requested tag $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_type == 'tag' && github.sha || format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      - name: Verify the selected workflow source matches the tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        env:
          RELEASE_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          if [[ "$GITHUB_SHA" != "$RELEASE_COMMIT" ]]; then
            echo "Run this workflow from tag $RELEASE_TAG so the attestation identifies the release source." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/wails/frontend/package-lock.json

      - name: Test release tooling
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts -p test_release.py
          go test -buildvcs=false ./scripts

      - name: Import Developer ID certificate and notary credentials
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/macos-release-keychain.sh signing

      - name: Build, sign, and submit the app to Apple
        env:
          RANCHER_RUNWAY_BUNDLE_ID: ${{ vars.RANCHER_RUNWAY_BUNDLE_ID || 'com.brudnak.rancher-runway' }}
          RANCHER_RUNWAY_BUILD_NUMBER: ${{ github.run_number }}
          RANCHER_RUNWAY_BUILD_COMMIT: ${{ steps.checkout.outputs.commit }}
          RANCHER_RUNWAY_NOTARY_STATE_DIR: ${{ runner.temp }}/notary-state
          RANCHER_RUNWAY_RELEASE_PHASE: submit-app
        run: scripts/package-macos-release.sh "$RELEASE_TAG"

      - name: Save the submitted app and Apple submission ID
        id: app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          name: notary-app-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/notary-state/app.zip
            ${{ runner.temp }}/notary-state/app-id

      - name: Remove signing credentials
        if: always() && steps.checkout.outcome == 'success'
        run: bash .github/scripts/macos-release-keychain.sh cleanup

  package-dmg:
    needs: build
    runs-on: macos-15
    timeout-minutes: 240
    environment: macos-release
    permissions:
      contents: read
      actions: read
    outputs:
      dmg_artifact: ${{ steps.dmg.outputs.artifact-id }}
    steps:
      - name: Checkout the signed release source
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Restore the submitted app and Apple submission ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.build.outputs.app_artifact }}
          path: ${{ runner.temp }}/notary-state

      - name: Import Developer ID certificate and notary credentials
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/macos-release-keychain.sh signing

      - name: Wait for the app, staple it, and submit the signed DMG
        env:
          RANCHER_RUNWAY_NOTARY_STATE_DIR: ${{ runner.temp }}/notary-state
          RANCHER_RUNWAY_RELEASE_PHASE: submit-dmg
        run: scripts/package-macos-release.sh "$RELEASE_TAG"

      - name: Save the release ZIP, submitted DMG, and Apple submission ID
        id: dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          name: notary-dmg-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/notary-state/release.zip
            ${{ runner.temp }}/notary-state/signed.dmg
            ${{ runner.temp }}/notary-state/dmg-id

      - name: Remove signing credentials
        if: always() && steps.checkout.outcome == 'success'
        run: bash .github/scripts/macos-release-keychain.sh cleanup

  release:
    needs: [build, package-dmg]
    runs-on: macos-15
    timeout-minutes: 240
    environment: macos-release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the signed release source
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Restore the release ZIP, submitted DMG, and Apple submission ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.package-dmg.outputs.dmg_artifact }}
          path: ${{ runner.temp }}/notary-state

      - name: Import notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/macos-release-keychain.sh notary-only

      - name: Wait for the DMG, staple it, and verify release artifacts
        env:
          RANCHER_RUNWAY_NOTARY_STATE_DIR: ${{ runner.temp }}/notary-state
          RANCHER_RUNWAY_RELEASE_PHASE: finish
        run: scripts/package-macos-release.sh "$RELEASE_TAG"

      - name: Render and validate Homebrew Cask
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/Rancher-Runway-${{ needs.build.outputs.version }}-macOS-universal.dmg"
          scripts/render-homebrew-cask.sh "$RELEASE_TAG" "$dmg" dist/rancher-runway.rb
          ruby -c dist/rancher-runway.rb

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/Rancher-Runway-*

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace published artifacts" >&2
            exit 1
          fi

          notes_path="$RUNNER_TEMP/rancher-runway-release-notes.md"
          printf '%s\n' 'This release is signed with Developer ID and notarized by Apple.' > "$notes_path"

          release_args=(
            "$RELEASE_TAG"
            dist/Rancher-Runway-*.dmg
            dist/Rancher-Runway-*.zip
            dist/Rancher-Runway-*-checksums.txt
            dist/rancher-runway.rb
            --draft
            --generate-notes
            --notes-file "$notes_path"
            --verify-tag
            --title "Rancher Runway $RELEASE_TAG"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          tag_commit="$(gh api -H 'Accept: application/vnd.github.sha' "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG")"
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG moved since the app was signed; refusing publication." >&2
            exit 1
          fi
          gh release create "${release_args[@]}"

          latest=legacy
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            latest=false
          fi
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f "make_latest=$latest" --silent

      - name: Update Homebrew tap
        if: needs.build.outputs.prerelease == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'brudnak/homebrew-tap' }}
          HOMEBREW_CASK_PATH: ${{ vars.HOMEBREW_CASK_PATH || 'Casks/rancher-runway.rb' }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; the generated Cask is attached to the GitHub Release but the tap was not updated."
            exit 0
          fi
          python3 scripts/release.py --update-tap-cask dist/rancher-runway.rb --version "$RELEASE_TAG"

      - name: Remove signing credentials
        if: always() && steps.checkout.outcome == 'success'
        run: bash .github/scripts/macos-release-keychain.sh cleanup
