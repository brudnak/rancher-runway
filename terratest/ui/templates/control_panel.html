  <script>
    const controlPanelSearchParams = new URLSearchParams(window.location.search)
    const savedControlPanelTheme = localStorage.getItem('rancherControlPanelTheme')
    const hintedControlPanelTheme = controlPanelSearchParams.get('systemTheme')
    const systemControlPanelDark = hintedControlPanelTheme === 'dark' || (!hintedControlPanelTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.classList.toggle('dark', savedControlPanelTheme ? savedControlPanelTheme === 'dark' : systemControlPanelDark)
  </script>

    .panel-nav button { appearance: none; font: inherit; cursor: pointer; }
    .panel-nav button:focus-visible, .panel-picker-search:focus-within {
      outline: 2px solid var(--runway-accent); outline-offset: 2px;
    }
    .panel-nav .hl-icon { width: 1.125rem; height: 1.125rem; flex: 0 0 auto; }
    .panel-nav-anchor, .panel-nav-search, .panel-nav-mobile, .panel-nav-group {

    .panel-picker-search > .hl-icon { color: var(--runway-muted); }

    .panel-picker-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 1.25rem 0.25rem; font-size: 0.75rem; color: var(--runway-muted); }
    .panel-picker-heading button, .panel-picker-empty button { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0; border: 0; background: transparent; color: var(--runway-accent); white-space: nowrap; }
    .panel-picker-groups { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1.25rem; padding: 1rem; overflow-y: auto; overscroll-behavior: contain; }

    .panel-picker-groups section { min-width: 0; }
    .panel-picker-groups h3 { margin: 0 0.625rem 0.6rem; font-size: 0.6875rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--runway-muted); font-weight: 700; }

    .panel-workspace-option { display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; padding: 0.8rem 0.625rem; border: 1px solid transparent; border-radius: 0.7rem; background: transparent; text-align: left; color: var(--runway-ink); }

    .panel-workspace-option[aria-current] { border-color: var(--runway-border); background: var(--runway-accent-soft); }
    .panel-option-icon { position: relative; display: grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: 0 0 auto; border: 1px solid var(--runway-border); border-radius: 0.65rem; background: var(--runway-soft); color: var(--runway-accent); }
    .panel-option-copy { display: grid; gap: 0.3rem; min-width: 0; }

    .run-current-pill {
      display: inline-flex;
      border-radius: 999px;
      background: rgb(244 244 245 / 0.9);
      padding: 0.28rem 0.58rem;
      font-size: 0.7rem;
      font-weight: 800;
      color: rgb(82 82 91);
    }
    .dark .run-current-pill {
      background: rgb(255 255 255 / 0.07);
      color: rgb(212 212 216);
    }
    .run-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid rgb(14 165 233 / 0.24);
      border-radius: 999px;
      background: rgb(224 242 254 / 0.7);
      padding: 0.28rem 0.58rem;
      color: rgb(7 89 133);
      font-size: 0.7rem;
      line-height: 1;
      font-weight: 820;
    }
    .dark .run-live-pill {
      border-color: rgb(14 165 233 / 0.28);
      background: rgb(14 165 233 / 0.1);
      color: rgb(186 230 253);
    }
    .run-progress {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      margin-top: 1rem;
      max-width: 48rem;
    }
    .run-progress-step {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.05rem;
      border-bottom: 1px solid rgb(228 228 231 / 0.85);
      color: rgb(113 113 122);
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dark .run-progress-step {
      border-color: rgb(255 255 255 / 0.12);
      color: rgb(161 161 170);
    }
    .run-progress-dot {
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 999px;
      background: rgb(161 161 170);
      box-shadow: 0 0 0 3px rgb(161 161 170 / 0.12);
    }
    .run-progress-step[data-state="done"],
    .run-progress-step[data-state="active"] {
      color: rgb(4 120 87);
      border-color: rgb(16 185 129 / 0.34);
    }
    .run-progress-step[data-state="failed"] {
      color: rgb(190 18 60);
      border-color: rgb(244 63 94 / 0.34);
    }
    .run-progress-step[data-state="done"] .run-progress-dot,
    .run-progress-step[data-state="active"] .run-progress-dot {
      background: rgb(16 185 129);
      box-shadow: 0 0 0 3px rgb(16 185 129 / 0.16);
    }
    .run-progress-step[data-state="failed"] .run-progress-dot {
      background: rgb(244 63 94);
      box-shadow: 0 0 0 3px rgb(244 63 94 / 0.16);
    }
    .run-progress-spinner {
      width: 0.78rem !important;
      height: 0.78rem !important;
      border-width: 1.5px !important;
    }
    .dark .run-progress-step[data-state="done"],
    .dark .run-progress-step[data-state="active"] {
      color: rgb(110 231 183);
    }
    .dark .run-progress-step[data-state="failed"] {
      color: rgb(253 164 175);
    }
    .run-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.85rem;
      margin-top: 1rem;
      max-width: 48rem;
    }
    .run-kpi {
      min-width: 0;
    }
    .run-kpi-label {
      font-size: 0.68rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgb(113 113 122);
    }
    .dark .run-kpi-label {
      color: rgb(161 161 170);
    }
    .run-kpi-value {
      margin-top: 0.32rem;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgb(39 39 42);
      font-size: 0.88rem;
      font-weight: 760;
      line-height: 1.35;
    }
    .dark .run-kpi-value {
      color: rgb(244 244 245);
    }
    .run-footline {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 1rem;
      color: rgb(82 82 91);
      font-size: 0.82rem;
    }
    .dark .run-footline {
      color: rgb(161 161 170);
    }
    .run-footline strong {
      color: rgb(39 39 42);
      font-weight: 850;
    }
    .dark .run-footline strong {
      color: rgb(228 228 231);
    }
    .run-command-panel {
      display: flex;
      min-width: 0;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0.8rem;
      flex-direction: column;
    }
    .run-primary-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
      min-width: 0;
    }
    .run-utility-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.25rem;
      border-top: 1px solid rgb(228 228 231 / 0.75);
      padding-top: 0.55rem;
    }
    .dark .run-utility-strip {
      border-color: rgb(255 255 255 / 0.1);
    }
    .run-action-button {
      display: inline-flex;
      min-height: 2.25rem;
      align-items: center;
      justify-content: center;
      border-radius: 0.55rem;
      border: 1px solid rgb(228 228 231);
      background: rgb(255 255 255 / 0.76);
      padding: 0.55rem 0.78rem;
      color: rgb(63 63 70);
      font-size: 0.8rem;
      font-weight: 820;
      white-space: nowrap;
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.7) inset, 0 8px 20px rgb(24 24 27 / 0.055);
      transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease, box-shadow 130ms ease, transform 130ms ease;
    }
    .dark .run-action-button {
      border-color: rgb(255 255 255 / 0.1);
      background: rgb(255 255 255 / 0.055);
      color: rgb(228 228 231);
      box-shadow: 0 10px 24px rgb(0 0 0 / 0.18);
    }
    .run-action-button--primary {
      border-color: rgb(16 185 129 / 0.75);
      background: rgb(16 185 129);
      color: white;
      box-shadow: 0 12px 24px rgb(16 185 129 / 0.22);
    }
    .run-action-button--blue {
      border-color: rgb(14 165 233 / 0.75);
      background: rgb(14 165 233);
      color: white;
      box-shadow: 0 12px 24px rgb(14 165 233 / 0.2);
    }
    .run-action-button--danger {
      border-color: rgb(244 63 94 / 0.78);
      background: rgb(244 63 94);
      color: white;
      box-shadow: 0 12px 24px rgb(244 63 94 / 0.22);
    }
    .run-action-button--utility {
      min-height: 1.85rem;
      justify-content: flex-start;
      border-color: transparent;
      background: transparent;
      padding: 0.35rem 0.42rem;
      color: rgb(82 82 91);
      font-size: 0.73rem;
      font-weight: 790;
      box-shadow: none;
    }
    .dark .run-action-button--utility {
      border-color: transparent;
      background: transparent;
      color: rgb(161 161 170);
      box-shadow: none;
    }
    .run-action-button--utility:not(:disabled):hover {
      background: rgb(244 244 245 / 0.85);
      color: rgb(24 24 27);
      box-shadow: none;
      transform: none;
    }
    .dark .run-action-button--utility:not(:disabled):hover {
      background: rgb(255 255 255 / 0.07);
      color: rgb(244 244 245);
      box-shadow: none;
    }
    .run-action-button--disabled {
      box-shadow: none;
    }
    .run-action-button:disabled {
      border-color: rgb(228 228 231) !important;
      background: rgb(244 244 245 / 0.9) !important;
      color: rgb(161 161 170) !important;
      box-shadow: none !important;
      transform: none !important;
    }
    .dark .run-action-button:disabled {
      border-color: rgb(255 255 255 / 0.08) !important;
      background: rgb(255 255 255 / 0.045) !important;
      color: rgb(113 113 122) !important;
    }
    .run-action-button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgb(24 24 27 / 0.1);
    }
    .dark .run-action-button:not(:disabled):hover {
      box-shadow: 0 16px 32px rgb(0 0 0 / 0.24);
    }
    @media (max-width: 900px) {
      .run-summary-strip,
      .run-row,
      .run-kpi-grid {
        grid-template-columns: 1fr;
      }
      .run-command-panel {
        align-items: flex-start;
        min-width: 0;
      }
      .run-primary-actions {
        justify-content: flex-start;
      }
      .run-utility-strip {
        width: 100%;
      }
    }
    .log-row {
      transition: background-color 100ms ease;
    }
    .log-row:hover {
      background: rgb(240 253 250 / 0.7);
    }
    .dark .log-row:hover {
      background: rgb(20 184 166 / 0.075);
    }
    body[data-booting="true"] button:disabled {
      filter: grayscale(0.15);
    }
    .control-panel-setup #interactiveSetupRoot main {
      min-height: auto;
      padding: 0;
    }
    .control-panel-setup .setup-shell {
      max-width: none;
    }
    .control-panel-setup .setup-header {
      margin-bottom: 1rem;
    }
    #interactiveSetupRoot section[data-section] { display: none; }
    #interactiveSetupRoot[data-phase="editor"] section[data-section="editor"] { display: block; }
    #interactiveSetupRoot[data-phase="resolving"] section[data-section="resolving"] { display: block; }
    #interactiveSetupRoot[data-phase="review"] section[data-section="review"] { display: block; }
    #interactiveSetupRoot[data-phase="done"] section[data-section="done"] { display: block; }
    #interactiveSetupRoot summary::-webkit-details-marker { display: none; }
    #interactiveSetupRoot details[open] .advanced-toggle-track { background: rgb(16 185 129); }
    #interactiveSetupRoot details[open] .advanced-toggle-knob { transform: translateX(1.25rem); }
    #interactiveSetupRoot .custom-hostname[data-enabled="false"] .hostname-control,
    #interactiveSetupRoot .custom-hostname[data-enabled="false"] .hostname-help { display: none; }
    body[data-panel-fullscreen="true"] main {
      padding: 0.75rem;
    }
    body[data-panel-fullscreen="true"] .panel-shell {
      max-width: none;
    }
    body[data-panel-fullscreen="true"] .panel-header {
      margin-bottom: 0.75rem;
    }
    body[data-panel-fullscreen="true"] #commandDeck {
      margin-bottom: 0.75rem;
    }
    body[data-panel-fullscreen="true"] .panel-nav {
      position: sticky;
      top: 0.75rem;
      z-index: 40;
    }
    body[data-panel-fullscreen="true"] #logModal {
      padding: 0.75rem;
    }
    .panel-nav-destination .panel-nav-anchor-label { display: inline; }
    @media (max-width: 760px) {
      .panel-nav-primary { flex-wrap: wrap; }
      .panel-nav-mobile { order: 10; flex-basis: 100%; }
      .panel-nav-search { margin-left: auto; }
    }
    .panel-main { --panel-gutter: 1rem; padding-top: 0; }
    .panel-main > .panel-nav { top: 0; margin-inline: calc(-1 * var(--panel-gutter)); border-radius: 0; padding-inline: var(--panel-gutter); }
    @media(min-width:640px) { .panel-main { --panel-gutter: 1.5rem; } }
    @media(min-width:1024px) { .panel-main { --panel-gutter: 2rem; } }
  </style>
</head>
<body data-workspace="home" data-booting="true" class="min-h-screen overflow-x-hidden bg-zinc-100 text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  <main class="panel-main min-h-screen px-4 py-5 sm:px-6 lg:px-8">
      <nav id="panelTabs" data-vue-owned="true" class="panel-nav mb-5" aria-label="Rancher Runway workspaces"></nav>
    <div class="panel-shell mx-auto max-w-[1680px]">
      <div id="controlPanelChromeVue"></div>




      <div class="grid min-w-0 gap-6">
        <section id="setupTabPanel" data-tab-panel="setup" class="control-panel-setup min-w-0" aria-label="Setup workspace">
          {{.SetupEditorHTML}}
        </section>

        <div id="controlPanelPanelsVue" class="contents"><section class="home-startup" role="status" aria-busy="true"><span class="home-eyebrow">Rancher Runway</span><h1>Opening your workspace.</h1><p>Preparing your tools and checking for active work…</p><span class="spinner" aria-hidden="true"></span></section></div>
      </div>
    </div>
  </main>

  <div id="controlPanelModalsVue" class="contents"></div>

  <script type="application/json" id="control-panel-data">{"token":"{{.Token}}","build":{{.Build}}}</script>
  <script src="/setup-editor/static/interactive_setup.js?token={{.Token}}" defer></script>
  <script type="module" src="/static/control_panel_header_vue.js"></script>
</body>
</html>
